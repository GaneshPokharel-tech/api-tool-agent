[project]
name = "api-tool-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Ganesh Pokharel", email = "246271712+GaneshPokharel-tech@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.142.2",
    "httpx>=0.28.1",
    "joblib>=1.6.0",
    "langchain>=1.4.3",
    "langchain-google-genai>=4.4.0",
    "pypdf>=6.19.0",
    "python-dotenv>=1.2.4",
    "scikit-learn==1.9.1",
    "streamlit>=1.64.0",
]

[project.scripts]
api-tool-agent = "api_tool_agent:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "watchdog>=6.0.0",
]
